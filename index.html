<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>DELAMAIN — Noyau autonome</title>
<link rel="icon" type="image/png" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ============ BOOT SEQUENCE ============ -->
  <div id="boot" aria-hidden="true">
    <div class="boot-ring"></div>
    <div class="boot-mark">
      <span class="boot-title">DELAMAIN</span>
      <span class="boot-sub">NOYAU AUTONOME — INSTANCE LOCALE</span>
    </div>
    <div class="boot-log" id="boot-log"></div>
  </div>

  <!-- ambient cursor glow, desktop only -->
  <div id="cursor-glow" aria-hidden="true"></div>

  <div id="app">

    <header class="topbar">
      <div class="brand">
        <img src="logo.png" alt="" class="brand-mark">
        <span class="brand-name">ERVIN&nbsp;DIGITAL&nbsp;CORP</span>
      </div>
      <div class="status">
        <span class="status-dot"></span>
        <span class="status-text">Noyau en ligne</span>
      </div>
    </header>

    <main class="stage">

      <!-- persistent portrait, always centered -->
      <div class="portrait-wrap">
        <div class="portrait-frame">
          <span class="corner tl"></span>
          <span class="corner tr"></span>
          <span class="corner bl"></span>
          <span class="corner br"></span>
          <div class="portrait-face" id="portrait-face"></div>
          <div class="portrait-scan"></div>
        </div>
        <div class="portrait-id">
          <span class="portrait-name">DELAMAIN</span>
          <span class="portrait-role">Chauffeur autonome · Night City</span>
        </div>
      </div>

      <!-- intro state: shown until the first message is sent -->
      <div class="intro" id="intro">
        <p class="intro-line">Montez. La ville ne vous attendra pas.</p>
        <div class="chips" id="chips">
          <button class="chip" data-prompt="Propose-moi un itinéraire pour traverser Night City en évitant les patrouilles NCPD.">Itinéraire</button>
          <button class="chip" data-prompt="Fais un diagnostic complet de mon véhicule, moteur et blindage.">Diagnostic véhicule</button>
          <button class="chip" data-prompt="Donne-moi les dernières infos sur les gangs qui contrôlent Night City en ce moment.">Réseau &amp; renseignement</button>
          <button class="chip" data-prompt="J'ai juste envie de discuter un peu, Delamain.">Discussion libre</button>
        </div>
      </div>

      <!-- conversation thread -->
      <div class="thread" id="thread"></div>

    </main>

    <footer class="composer">
      <form id="composer-form" autocomplete="off">
        <input type="text" id="composer-input" placeholder="Écrire à Delamain…" maxlength="600">
        <button type="submit" class="send-btn" aria-label="Envoyer">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/></svg>
        </button>
      </form>
      <p class="composer-note">Delamain peut se tromper. Vérifiez les informations sensibles.</p>
    </footer>

  </div>

  <script src="script.js"></script>
</body>
</html>
